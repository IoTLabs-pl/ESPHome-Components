name: Compilation check
on:
  pull_request:

env:
  ESPHOME_VERSION: "2026.8.2"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - wmbus/test
          - wmbus/sx1262
          - panasonic_aquarea/test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build firmware
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: tests/${{ matrix.config }}.yaml
          version: ${{ env.ESPHOME_VERSION }}

  telegrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
      - name: Install esphome
        run: pip install "esphome==$ESPHOME_VERSION" pytest
      - name: Decode the upstream telegrams
        run: pytest tests/wmbus/host -q
