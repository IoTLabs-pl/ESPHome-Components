name: Compilation check
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - wmbus/sx1276
          - wmbus/sx1262
          - panasonic_aquarea/test
        variant:
          - esp32
          - esp32s3
          - esp32c3
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build firmware
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: tests/${{ matrix.config }}.yaml
          version: "2026.9.1"
          substitutions: variant=${{ matrix.variant }}
